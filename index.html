<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Harpe — a hooked blade for the web</title>
    <meta name="description" content="One command to pull video, image galleries, whole pages of images, or high-resolution artwork from the world's museums. The fzf TUI is just one frontend — the engine is yours." />
    <meta name="theme-color" content="#0a0806" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Link previews. NOTE: these are STATIC defaults (Vite is a static SPA).

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Harpe" />
    <meta property="og:url" content="https://harpe-site.vercel.app/" />
    <meta property="og:title" content="Harpe — a hooked blade for the web" />
    <meta property="og:description" content="Enter, catch, retrieve. Search millions of open artworks across museum collections and cultural aggregators, or grab every image from any page — free, no install." />
    <meta property="og:image" content="https://harpe-site.vercel.app/logo-bronze.png" />
    <meta property="og:image:alt" content="Harpe — a bronze hooked sickle-blade" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Harpe — a hooked blade for the web" />
    <meta name="twitter:description" content="Search millions of open artworks across museum collections and cultural aggregators, or grab every image from any page — free, no install." />
    <meta name="twitter:image" content="https://harpe-site.vercel.app/logo-bronze.png" />

    <!-- LCP image preload: WebP for supporting browsers (PNG stays as fallback) -->
    <link rel="preload" as="image" href="/logo.webp" type="image/webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

        <p>A hooked blade for the web — enter, catch, retrieve. One command to pull video, image galleries, whole pages of images, or high-resolution artwork from the world's museums.</p>
