name: Monitor

# Continuous synthetic monitoring of the LIVE site + upstream sources. On a
# critical failure it opens (or updates) a single tracking issue with full
# diagnostics, and closes it automatically when everything recovers.
on:
  schedule:
    - cron: '17 */6 * * *' # every 6h (offset off the hour)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: run
        run: node tests/live/monitor.mjs
        continue-on-error: true
      - name: Report to tracking issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let data;
            try { data = JSON.parse(fs.readFileSync('monitor-results.json', 'utf8')); }
            catch { core.setFailed('monitor produced no results'); return; }

            const LABEL = 'monitor';
            const TITLE = '🔴 Harpe monitor: failing checks';
            const { owner, repo } = context.repo;
            const critical = data.results.filter(r => !r.ok && r.critical);

            // Ensure the label exists (idempotent).
            try { await github.rest.issues.getLabel({ owner, repo, name: LABEL }); }
            catch { await github.rest.issues.createLabel({ owner, repo, name: LABEL, color: 'b60205', description: 'Live monitor failures' }); }

            const icon = r => r.ok ? '✅' : (r.critical ? '❌' : '⚠️');
            const body = [
              `Monitor run **${data.at}** against \`${data.base}\` (commit \`${context.sha.slice(0,7)}\`).`,
              '',
              ...data.results.map(r => `- ${icon(r)} ${r.name}${r.err ? ` — \`${String(r.err).slice(0,200)}\`` : ''}${r.note ? ` _(${r.note})_` : ''}`),
              '',
              `**${data.results.filter(r => r.ok).length}/${data.results.length} ok · ${critical.length} critical**`,
              '',
              '<sub>Auto-generated by `.github/workflows/monitor.yml`. Add the **autoheal** label to have Claude draft a candidate fix PR (requires the Claude GitHub app + `ANTHROPIC_API_KEY`).</sub>',
            ].join('\n');

            const open = (await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: LABEL })).data[0];
            if (critical.length) {
              if (open) await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
              else await github.rest.issues.create({ owner, repo, title: TITLE, body, labels: [LABEL] });
            } else if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `✅ Recovered as of ${data.at}. Auto-closing.` });
              await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
            }
      - name: Fail run on critical failure
        if: steps.run.outcome == 'failure'
        run: exit 1
