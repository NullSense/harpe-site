name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck (client + api)
        run: npm run typecheck
      - name: Unit + integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify serverless functions bundle
        run: npm run check:api
