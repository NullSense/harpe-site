<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; width: 320px; font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0a0806; color: #e9e0d4;
    }
    .wrap { padding: 14px; }
    h1 { margin: 0 0 2px; font-size: 15px; letter-spacing: .02em; }
    h1 .b { color: #c8965a; }
    p.sub { margin: 0 0 12px; font-size: 11px; color: #8a7d6c; font-family: ui-monospace, monospace; }
    input {
      width: 100%; box-sizing: border-box; padding: 9px 10px; border-radius: 8px;
      border: 1px solid #2a211a; background: #140e0a; color: #e9e0d4; font-size: 13px; outline: none;
    }
    input:focus { border-color: #c8965a88; }
    .row { display: flex; gap: 8px; margin-top: 8px; }
    button, .btn {
      flex: 1; cursor: pointer; padding: 9px 8px; border-radius: 8px; font-size: 12px;
      border: 1px solid #c8965a55; background: #c8965a18; color: #e2b988; transition: .15s;
      font-family: ui-monospace, monospace; text-align: center;
    }
    button:hover, .btn:hover { background: #c8965a30; border-color: #c8965a; }
    .ghost { border-color: #2a211a; background: transparent; color: #8a7d6c; }
    .hint { margin-top: 10px; font-size: 10.5px; color: #6f6456; line-height: 1.5; font-family: ui-monospace, monospace; }
    .settings { margin-top: 10px; display: none; }
    .settings.open { display: block; }
    .settings label { display: block; font-size: 10px; color: #8a7d6c; margin-bottom: 4px; font-family: ui-monospace, monospace; }
    a { color: #c8965a; }
    .gear { float: right; cursor: pointer; color: #6f6456; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <span class="gear" id="gear" title="Settings">⚙</span>
    <h1><span class="b">⌐</span> Harpe</h1>
    <p class="sub">enter, catch, retrieve.</p>

    <input id="q" type="text" placeholder="Search art, or paste any link…" autocomplete="off" />
    <div class="row">
      <button id="go">Search / grab</button>
      <button id="tab" class="ghost" title="Grab the page you're on">⤓ this page</button>
    </div>

    <div class="settings" id="settings">
      <label for="base">Harpe site URL (point at your own deploy if you like)</label>
      <input id="base" type="text" placeholder="https://harpe-site.vercel.app" />
    </div>

    <p class="hint">
      Type to search 15 museum collections, or paste a page / image / gigapixel /
      X-post / video link. YouTube·IG·TikTok need a cobalt backend on your deploy.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
